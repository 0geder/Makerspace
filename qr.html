<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makerspace Quest · QR sticker sheet</title>
<style>
  :root { --text: #3b2a1a; --muted: #7a6753; --line: #e3d3b8; --accent: #e2583e; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); background: #fbf6ec; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { margin: 8px 0 4px; font-size: 24px; color: var(--accent); }
  .tools { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 12px 0 18px; }
  .tools label { display: block; font-weight: 700; margin-bottom: 6px; }
  .tools input { width: 100%; padding: 10px; font: inherit; border: 2px solid var(--line); border-radius: 10px; }
  .tools p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .warn { color: #b3261e; font-weight: 700; }
  .tools button { margin-top: 10px; padding: 10px 16px; font: inherit; font-weight: 700; border: 0; border-radius: 10px; background: #2eaa5a; color: #fff; cursor: pointer; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 3px solid var(--c, var(--line)); border-radius: 16px; padding: 12px; text-align: center; break-inside: avoid; page-break-inside: avoid; }
  .card .icon { font-size: 30px; line-height: 1; }
  .card h2 { margin: 4px 0 8px; font-size: 17px; }
  .card svg, .card img { display: block; width: 100%; max-width: 190px; height: auto; margin: 0 auto; }
  .card .cta { margin: 8px 0 2px; font-weight: 800; }
  .card code { display: block; font-size: 10px; color: var(--muted); word-break: break-all; }
  @media print {
    body { background: #fff; }
    .tools, h1 + p { display: none; }
    main { max-width: none; padding: 0; }
    .sheet { grid-template-columns: repeat(2, 1fr); gap: 10mm; }
    .card { border-width: 2px; }
  }
</style>
</head>
<body>
<main>
  <h1>🔳 QR sticker sheet</h1>
  <p>One sticker per area of the Makerspace. Scanning it opens that area in Makerspace Quest and unlocks its mini-game.</p>
  <div class="tools">
    <label for="base">Game address (where members open Makerspace Quest)</label>
    <input id="base" inputmode="url" autocomplete="off" spellcheck="false">
    <p id="note"></p>
    <button id="print" type="button">🖨️ Print stickers</button>
  </div>
  <div class="sheet" id="sheet"></div>
</main>

<script src="vendor/qrcode.js"></script>
<script>var MS = { data: {} };</script>
<script src="data/makerspace.js"></script>
<script src="data/stations.js"></script>
<script>
  // One card per area in data/stations.js: icon, name and a QR code for <game address>?at=<id>.
  (function () {
    var base = document.getElementById("base"), sheet = document.getElementById("sheet"), note = document.getElementById("note");
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
    // this page's own folder, e.g. https://you.github.io/Makerspace/  (qr.html itself is left off)
    var here = location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, "");
    base.value = localStorage.getItem("ms-qr-base") || here;

    function link(id) {
      var b = base.value.trim();
      return b + (b.indexOf("?") < 0 ? "?" : "&") + "at=" + encodeURIComponent(id);
    }

    function draw() {
      var b = base.value.trim(), local = /^(file:|https?:\/\/(localhost|127\.|192\.168\.|10\.|\[::1\]))/i.test(b);
      localStorage.setItem("ms-qr-base", b);
      note.innerHTML = !/^https?:\/\//i.test(b)
        ? '<span class="warn">⚠️ Enter the full web address, starting with https://</span>'
        : local ? '<span class="warn">⚠️ This address only works on this computer or network. Before printing, paste the public (GitHub Pages) address of the game.</span>'
        : "Check one sticker with your phone before printing the whole sheet.";
      sheet.innerHTML = MS.data.stations.map(function (s) {
        var qr = qrcode(0, "M"); // type 0 = smallest version that fits
        qr.addData(link(s.id)); qr.make();
        return '<div class="card" style="--c:' + esc(s.color) + '">' +
          '<div class="icon">' + (s.badge ? s.badge.icon : "📍") + '</div>' +
          '<h2>' + esc(s.name) + '</h2>' + qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }) +
          '<p class="cta">Scan to play!</p><code>' + esc(link(s.id)) + '</code></div>';
      }).join("");
    }

    base.addEventListener("input", draw);
    document.getElementById("print").onclick = function () { window.print(); };
    draw();
  })();
</script>
</body>
</html>
